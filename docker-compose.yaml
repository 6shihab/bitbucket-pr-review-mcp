# Two deployment shapes, one file, one review engine.
#
#   docker compose run --rm bitbucket-pr-review      # per-device: stdio, one credential
#   docker compose --profile shared up -d            # shared: several people, over HTTP
#
# The per-device service is the one described in the README and in docs/adr/0007. It
# speaks MCP over stdio, so it has no port and nothing to `up` — the service exists so
# the flags are written down once rather than remembered.
#
# THE SHARED PROFILE'S DEFAULTS ARE DEVELOPMENT CONFIGURATION. With no `.env` present
# Keycloak runs in dev mode with an in-memory database, a bootstrap admin whose password
# is in this file, and a realm carrying a user whose password is in the realm file —
# everything plain http on loopback. Every one of those is a variable with a default, so
# a real deployment overrides them in `.env` rather than editing this file; see
# `.env.example`. Read docs/deploying-the-shared-server.md before running it anywhere.
services:
  # ---------------------------------------------------------------- per-device (stdio)
  bitbucket-pr-review:
    build: .
    image: bitbucket-pr-review-mcp:local
    profiles: ["stdio"]

    # stdio is the whole interface.
    stdin_open: true
    tty: false

    # The credential, from a file that is not in this repository. See docs/adr/0007.
    # Keep it outside the working tree, or at least out of git: `.env.docker` is
    # gitignored here, and `docker inspect` will show these values on the container.
    env_file:
      - .env.docker

    volumes:
      # The allowlist: the repositories this server may touch at all. Read-only —
      # nothing in the server writes it, and a container that could rewrite its own
      # access control would be a strange thing to build.
      - ./config/repositories.yaml:/config/repositories.yaml:ro

    # Nothing here writes to disk, listens on a port, or needs a capability.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # -------------------------------------------------------------------- shared (HTTP)
  proxy:
    image: nginx:1.27-alpine
    profiles: ["shared"]
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      # One port, one origin. Both the review server and Keycloak are behind it, which
      # is what makes the issuer string mean the same thing everywhere.
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/realms/streamstech || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  review:
    build: .
    image: bitbucket-pr-review-mcp:local
    profiles: ["shared"]
    command:
      ["--http", "--host", "127.0.0.1", "--port", "8000"]

    # Shares the proxy's network namespace, so `localhost:8080` inside this container is
    # the same address a browser types. Without that the review server cannot fetch the
    # discovery document for the issuer it was configured with — the one string that has
    # to be identical in the token, the metadata, the browser and here.
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started

    environment:
      # Defaults are the loopback development stack. `.env` overrides them for a
      # real deployment; see .env.example. The issuer and the public URL have to
      # name the same origin as KC_HOSTNAME below, exactly.
      BB_MCP_PUBLIC_URL: ${BB_MCP_PUBLIC_URL:-http://localhost:8080/mcp}
      BB_MCP_OIDC_ISSUER: ${BB_MCP_OIDC_ISSUER:-http://localhost:8080/realms/streamstech}
      BB_MCP_OIDC_CLIENT_SECRET: ${BB_MCP_OIDC_CLIENT_SECRET:-development-only-replace-before-deploying-too}
      BB_MCP_VAULT_FILE: ${BB_MCP_VAULT_FILE:-/vault/credentials.sqlite3}
      BB_MCP_VAULT_KEY_FILE: /run/secrets/vault.key
      BB_MCP_LOG_LEVEL: ${BB_MCP_LOG_LEVEL:-INFO}
      BB_MCP_LOG_JSON: ${BB_MCP_LOG_JSON:-false}

    volumes:
      - ./config/repositories.yaml:/config/repositories.yaml:ro
      # The key, read-only and from outside the repository. It must not live where the
      # store's backups reach: that separation is the whole of what the encryption buys.
      #
      # Required, with no default, and an **absolute** path. Both halves of that are
      # scars. A default of `~/.bb-pr-mcp/vault.key` expands to a home directory on some
      # machines and is treated as relative to this directory on others, and a relative
      # bind source is resolved against the project directory — so the same file said
      # different things on a laptop and on a server. Worse, when a bind source does not
      # exist Docker creates a *directory* there and then fails to mount it onto a file,
      # which is a mount error several layers away from "there is no key".
      - type: bind
        source: "${BB_MCP_VAULT_KEY_PATH:?set this in .env to the ABSOLUTE path of the vault key file on this host (see .env.example). It must already exist - nothing generates one for you}"
        target: /run/secrets/vault.key
        read_only: true
        bind:
          # Asks Docker not to invent the source path. When it is honoured, a missing key
          # is reported as a missing path instead of being created as a directory and
          # failing later as a mount type mismatch.
          #
          # It is not honoured everywhere — Docker Desktop on Windows creates the
          # directory regardless, verified. So it is a nicety, not the guard: the guard
          # is `VaultKey.required`, which refuses to start on a directory and says why.
          create_host_path: false
      # The store itself, which is the one thing here that must survive a restart.
      - ./.bb-pr-mcp/review-vault:/vault

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    # The image's own HEALTHCHECK is `--check`, which is right for the per-device server
    # and wrong here: it asks the OS keychain for a credential, and a container has no
    # keychain (ADR-0007). `--health` is not the answer either — it is an operator's
    # fitness report, and it exits non-zero on advisory concerns like "this is plain
    # http", which is true of this stack by design. A liveness probe should ask one
    # question: is the server answering?
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp',timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  # Keycloak's database. Without it Keycloak runs on an in-memory store, and a restart
  # loses every account anybody signed in with. That is fine for an afternoon and wrong
  # for anything people depend on.
  postgres:
    image: postgres:17-alpine
    profiles: ["shared"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-replace-before-deploying}
    volumes:
      - ./.bb-pr-mcp/keycloak-db:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["shared"]

    # `start-dev` by default, because the defaults here are the development stack. A real
    # deployment sets KC_START_COMMAND=start, which turns off the dev-mode conveniences
    # and requires the hostname and database to be configured — which, here, they are.
    command: ["${KC_START_COMMAND:-start-dev}", "--import-realm"]

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL_HOST: ${KC_DB_HOST:-postgres}
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-replace-before-deploying}

      # Dev-only bootstrap admin. A real deployment sets these from a secret store.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}

      # The issuer people and tokens will name. It has to match what the review server is
      # configured with, exactly — a token whose `iss` differs by a trailing slash is a
      # token this server refuses, on purpose (RFC 8414's mix-up defence).
      KC_HOSTNAME: ${BB_MCP_PUBLIC_ORIGIN:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      # Read by the realm file, not by Keycloak itself: `--import-realm` substitutes
      # `${NAME}` from the environment before the realm is created. Everything in that
      # file which differs between deployments is one of these, so the origin is stated
      # once in `.env` and the realm follows it.
      #
      # The defaults live here rather than in the realm file, and that is not a style
      # choice. Keycloak resolves `${NAME:default}` to the default *without consulting
      # the environment* — a realm written that way ignores every variable set for it and
      # says nothing. Only the bare `${NAME}` reads the environment, so the realm carries
      # no defaults and every one of these must be set. Checked against 26.4 by importing
      # a realm and reading it back, because the documentation reads the other way.
      #
      # Substitution happens at *import*, and import happens once: the realm is in the
      # database now, and `--import-realm` leaves an existing realm alone. Changing one
      # of these later means dropping that database so the realm is imported again —
      #
      #     docker compose --profile shared down
      #     docker volume rm bitbucket-pr-review-mcp_keycloak-db
      #
      # naming the volume rather than reaching for `down -v`, which would take the
      # credential vault with it.
      BB_MCP_PUBLIC_URL: ${BB_MCP_PUBLIC_URL:-http://localhost:8080/mcp}
      BB_MCP_PUBLIC_ORIGIN: ${BB_MCP_PUBLIC_ORIGIN:-http://localhost:8080}
      BB_MCP_OIDC_CLIENT_SECRET: ${BB_MCP_OIDC_CLIENT_SECRET:-development-only-replace-before-deploying-too}
      BB_MCP_CONNECTOR_CLIENT_SECRET: ${BB_MCP_CONNECTOR_CLIENT_SECRET:-development-only-replace-before-deploying}
      # `external` allows plain http on loopback; a public deployment wants `all`.
      BB_MCP_SSL_REQUIRED: ${BB_MCP_SSL_REQUIRED:-external}

    volumes:
      # The realm: the three clients, the bitbucket:review scope, and the audience mapper
      # that puts this server's URL into every access token.
      #
      # That mapper is not decoration. Keycloak does not implement RFC 8707, so it
      # ignores the `resource` parameter Claude sends. Without it, tokens carry no
      # audience for us and the review server refuses all of them — correctly, because a
      # token with no audience was not minted for anybody in particular.
      - ./deploy/keycloak/realm-streamstech.json:/opt/keycloak/data/import/realm-streamstech.json:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  keycloak-db:
