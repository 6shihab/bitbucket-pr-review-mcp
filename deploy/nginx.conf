# One hostname for two services, which is not a convenience.
#
# The authorization server's issuer is a *string*, and it has to mean the same thing
# everywhere: in the token's `iss`, in the discovery document, in what the review server
# was configured with, and in what a browser opens. Put Keycloak on one host and the MCP
# endpoint on another and that string is reachable from some of those places and not
# others — the review server cannot fetch `localhost:8080` from inside its own container.
#
# Anthropic's connector documentation recommends this shape for the same reason from the
# other direction: it says a cross-host authorization server can be resolved, while a
# claude.ai issue reports the web client constructing `/authorize` from the MCP base URL
# instead. Serving both under one origin makes that disagreement moot.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # A pull request diff is not small, and neither is a review posted in one call.
    client_max_body_size 8m;

    # Where the request says it came from, preferring what a proxy in front of this one
    # already said over what this hop can see.
    #
    # TLS is terminated in front of this container in any real deployment, so the
    # connection *into* here is plain http on 8080: `$scheme` is `http` and
    # `$server_port` is `8080` however the browser arrived. Stating those unconditionally
    # overwrote an outer proxy's `X-Forwarded-Proto: https` with `http`, and Keycloak
    # trusts these headers (KC_PROXY_HEADERS=xforwarded) — so a public https request
    # looked insecure and was refused under `sslRequired`.
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    map $http_x_forwarded_host $forwarded_host {
        ""      $host;
        default $http_x_forwarded_host;
    }

    map $http_x_forwarded_port $forwarded_port {
        ""      $server_port;
        default $http_x_forwarded_port;
    }

    # What every upstream needs to know about the request it would otherwise not see.
    # Keycloak in particular builds its issuer and its redirect checks from these.
    #
    # These apply to the locations that declare no `proxy_set_header` of their own.
    # nginx does not merge these directives across levels: a block that sets *any* of
    # them discards *all* of the ones above it. So `location /` repeats them, and any
    # new block that needs one header needs the lot.
    proxy_set_header Host              $forwarded_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $forwarded_host;
    proxy_set_header X-Forwarded-Port  $forwarded_port;

    server {
        listen 8080;
        server_name _;

        # Keycloak owns its realms, the assets its login pages pull in, the admin
        # console, and the RFC 8414 well-known path — which inserts itself *before* the
        # realm path, so it cannot be matched by the realm prefix.
        location /realms/ {
            proxy_pass http://keycloak:8080;
        }

        location /resources/ {
            proxy_pass http://keycloak:8080;
        }

        location /admin/ {
            proxy_pass http://keycloak:8080;
        }

        location /.well-known/oauth-authorization-server {
            proxy_pass http://keycloak:8080;
        }

        location = /.well-known/openid-configuration {
            proxy_pass http://keycloak:8080;
        }

        # Everything else is the review server: /mcp, /connect, and its own
        # protected-resource metadata. It shares this container's network namespace, so
        # 127.0.0.1 here is genuinely local.
        location / {
            proxy_pass http://127.0.0.1:8000;

            # Repeated, not inherited. Setting `Connection` below discards every
            # `proxy_set_header` from the `http` block, and the one that hurts is `Host`:
            # nginx then defaults it to `$proxy_host`, so this server sees `127.0.0.1:8000`
            # and builds its own address out of it. The symptom is signing in on the real
            # hostname and being redirected to `127.0.0.1:8000/connect/`, which is a
            # working server nobody's browser can reach.
            proxy_set_header Host              $forwarded_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host  $forwarded_host;
            proxy_set_header X-Forwarded-Port  $forwarded_port;

            # Streamable HTTP can answer as an event stream. Buffering one of those turns
            # a response that should arrive as it is produced into a response that arrives
            # when it is finished, and a review that streams nothing looks like a hang.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
