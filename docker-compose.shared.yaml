# The shared deployment: several people, one server, Claude on the web as the client.
#
# This is NOT the per-device install. `docker-compose.yaml` is that one — stdio, one
# credential, no ports. Two deployment shapes, one review engine; see docs/adr/0008.
#
#   docker compose -f docker-compose.shared.yaml up -d keycloak
#
# What is here today is the authorization server. The MCP service joins it in ticket 12,
# when there is an HTTP transport to run, and a reverse proxy joins them both when there
# are two upstreams to route between — Claude wants the MCP endpoint and the
# authorization server reachable under one hostname, and a proxy with one upstream is a
# moving part that proves nothing.
#
# THIS FILE IS DEVELOPMENT CONFIGURATION. Keycloak runs in dev mode with an in-memory
# database, a bootstrap admin whose password is in this file, and a realm carrying a user
# whose password is also in this file. None of that survives contact with a real
# deployment: see docs/deploying-the-shared-server.md before running it anywhere else.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]

    environment:
      # Dev-only bootstrap admin. A real deployment sets these from a secret store and
      # rotates the password immediately.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # The issuer people and tokens will name. It has to match what the MCP server is
      # configured with, exactly — a token whose `iss` differs by a trailing slash is a
      # token this server refuses, on purpose (RFC 8414's mix-up defence).
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

    ports:
      - "8080:8080"

    volumes:
      # The realm: the client Claude authenticates as, the bitbucket:review scope, and
      # the audience mapper that puts this server's URL into every access token.
      #
      # That mapper is not decoration. Keycloak does not implement RFC 8707, so it
      # ignores the `resource` parameter Claude sends on every authorization and token
      # request. Without the mapper, tokens carry no audience for us and the MCP server
      # refuses all of them — correctly, because a token with no audience is a token
      # that was not minted for anybody in particular.
      - ./deploy/keycloak/realm-streamstech.json:/opt/keycloak/data/import/realm-streamstech.json:ro

    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
